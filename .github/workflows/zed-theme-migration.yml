name: Zed Theme Migration

on:
  workflow_dispatch:
  push:
    branches:
      - automation/zed-theme-migration
    paths:
      - 'themes/**'
      - 'package.json'
      - 'scripts/migrate_to_zed.py'
      - '.github/workflows/zed-theme-migration.yml'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize VS Code JSONC source for strict parser
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('themes').glob('*-color-theme.json'):
              text = path.read_text(encoding='utf-8')
              text = text.replace('false // TODO: Maybe in feature', 'false')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Generate and structurally validate all Zed themes
        run: python scripts/migrate_to_zed.py
      - name: Upload generated theme set
        uses: actions/upload-artifact@v4
        with:
          name: kintsugi-zed-themes
          path: dist/kintsugi-zed
          if-no-files-found: error
